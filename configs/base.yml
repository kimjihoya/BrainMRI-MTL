# Base config — shared defaults.
# Experiment configs inherit with `_base_: base.yml` and override only what changes
# (deep-merged by shared/config_utils.py). Paths mirror paths.py; fill in /path/to/... .

gpu:
  visible_device: 0

model:
  t2_backbone: brainiac      # brainiac | triad | brainmvp | none
  dwi_backbone: triad        # triad | none
  image_feat_dim: 128
  dwi_feat_dim: 256
  tab_feat_dim: 128
  film: false

# Pretrained backbone weights (obtained separately — see README section 6)
triad:
  ckpt_path: /path/to/Triad/weight/Triad-PlainConvUNet-MAE.pth
simclrvit:                   # BrainIAC (T2 encoder)
  ckpt_path: /path/to/BrainIAC/checkpoints/BrainIAC.ckpt
brainmvp:
  ckpt_path: /path/to/BrainMVP/checkpoint.pth

data:
  size: [96, 96, 96]
  dwi_dir: /path/to/data/DWI_preprocessed
  flair_dir: /path/to/data/FLAIR_preprocessed
  clinical_csv: /path/to/data/all_data.csv
  outcomes_final_csv: data/csvs/outcomes_final.csv   # repo-relative single source of labels
  csv_file: data/csvs/train.csv                      # training split (pat_id, t2_path, mrs3mo_binary, ...)
  val_csv:  data/csvs/holdout.csv                     # untouched holdout split, same columns
  batch_size: 16
  num_workers: 4
